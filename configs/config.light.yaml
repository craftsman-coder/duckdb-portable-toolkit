# ==================================================================
# Light installation - minimal footprint (~500 MB)
# ==================================================================

paths:
  project_root: "."
  runtime_dir:    "runtime"
  python_dir:     "runtime/python"
  venv_dir:       "runtime/venv"
  duckdb_dir:     "runtime/duckdb"
  extensions_dir: "runtime/duckdb/extensions"
  models_dir:     "runtime/duckdb/models"
  jobs_dir:       "jobs"
  configs_dir:    "configs"
  data_dir:       "data"
  exports_dir:    "exports"
  logs_dir:       "logs"
  mlruns_dir:     "mlruns"
  reports_dir:    "reports"

python:
  version: "3.12.7"

pytorch:
  build: "cpu"
  cuda_version: "cu121"

packages:
  core:            true
  jupyter:         true
  visualization:   false
  streamlit:       false
  eda:             false
  data_quality:    false
  notebook_tools:  false
  scheduling:      false
  ml:              false
  mlops:           false
  cloud:           false
  utilities:       true

extensions:
  core:
    - parquet
    - json
    - icu
  community: []

ai:
  enabled: false

duck_ui:
  enabled: false

mcp:
  enabled: true
  db_path: ":memory:"
  read_only: true
  http_port: 8801

runtime:
  duckdb_memory_limit: "4GB"
  duckdb_threads: 2
  jupyter_port: 8888
  streamlit_port: 8501

scheduler:
  log_dir: "logs"
  timezone: "UTC"

setup:
  download_python:      true
  download_duckdb:      true
  install_packages:     true
  install_extensions:   true
  create_config_files:  true
  skip_existing:        true