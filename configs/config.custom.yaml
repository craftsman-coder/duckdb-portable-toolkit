# ==================================================================
# Custom installation - start from full, edit as you wish
# ==================================================================
# Run `python setup.py` and choose option 4.
# Then edit config.yaml and run `python setup.py` again.
# ==================================================================

paths:
  project_root: "."
  runtime_dir:    "runtime"
  python_dir:     "runtime/python"
  venv_dir:       "runtime/venv"
  duckdb_dir:     "runtime/duckdb"
  extensions_dir: "runtime/duckdb/extensions"
  models_dir:     "runtime/duckdb/models"
  jobs_dir:       "jobs"
  configs_dir:    "configs"
  data_dir:       "data"
  exports_dir:    "exports"
  logs_dir:       "logs"
  mlruns_dir:     "mlruns"
  reports_dir:    "reports"

python:
  version: "3.12.7"

pytorch:
  # cpu | cuda
  build: "cpu"
  cuda_version: "cu121"

packages:
  core:            true
  jupyter:         true
  visualization:   true
  streamlit:       true
  eda:             true
  data_quality:    true
  notebook_tools:  true
  scheduling:      true
  ml:              true
  mlops:           true
  cloud:           true
  utilities:       true

extensions:
  core:
    - parquet
    - json
    - icu
    - httpfs
    - fts
    - vss
    - inet
    - iceberg
    - delta
    - ducklake
    - lance
    - ui
  community:
    - paimon
    - qvd
    - pbix
    - oracle_scanner
    - postgres_scanner
    - mysql_scanner
    - sqlite_scanner
    - mssql
    - mongo
    - cassandra
    - odbc_scanner
    - ai
    - whisper

ai:
  enabled: true
  provider: "ollama"
  ollama_host: "http://localhost:11434"
  # qwen2.5-coder:1.5b | qwen2.5-coder:3b | qwen3:4b | gemma3:4b
  model: "qwen2.5-coder:3b"
  auto_pull: true

duck_ui:
  enabled: true
  port: 5522

mcp:
  enabled: true
  db_path: ":memory:"
  read_only: true
  http_port: 8801

runtime:
  # Laptop: 4-8 GB. Server with 256 GB: 200 GB.
  duckdb_memory_limit: "8GB"
  duckdb_threads: 4
  jupyter_port: 8888
  streamlit_port: 8501

scheduler:
  log_dir: "logs"
  timezone: "UTC"

setup:
  download_python:      true
  download_duckdb:      true
  install_packages:     true
  install_extensions:   true
  create_config_files:  true
  skip_existing:        true