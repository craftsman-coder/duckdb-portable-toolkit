# ==================================================================
# Standard installation - balanced (~3-4 GB)
# ==================================================================

paths:
  project_root: "."
  runtime_dir:    "runtime"
  python_dir:     "runtime/python"
  venv_dir:       "runtime/venv"
  duckdb_dir:     "runtime/duckdb"
  extensions_dir: "runtime/duckdb/extensions"
  models_dir:     "runtime/duckdb/models"
  jobs_dir:       "jobs"
  configs_dir:    "configs"
  data_dir:       "data"
  exports_dir:    "exports"
  logs_dir:       "logs"
  mlruns_dir:     "mlruns"
  reports_dir:    "reports"

python:
  version: "3.12.7"

pytorch:
  build: "cpu"
  cuda_version: "cu121"

packages:
  core:            true
  jupyter:         true
  visualization:   true
  streamlit:       true
  eda:             false
  data_quality:    false
  notebook_tools:  false
  scheduling:      true
  ml:              true
  mlops:           false
  cloud:           true
  utilities:       true

extensions:
  core:
    - parquet
    - json
    - icu
    - httpfs
    - fts
    - iceberg
    - delta
  community:
    - qvd
    - oracle_scanner
    - postgres_scanner
    - mysql_scanner

ai:
  enabled: true
  provider: "ollama"
  ollama_host: "http://localhost:11434"
  model: "qwen2.5-coder:3b"
  auto_pull: true

duck_ui:
  enabled: true
  port: 5522

mcp:
  enabled: true
  db_path: ":memory:"
  read_only: true
  http_port: 8801

runtime:
  duckdb_memory_limit: "8GB"
  duckdb_threads: 4
  jupyter_port: 8888
  streamlit_port: 8501

scheduler:
  log_dir: "logs"
  timezone: "UTC"

setup:
  download_python:      true
  download_duckdb:      true
  install_packages:     true
  install_extensions:   true
  create_config_files:  true
  skip_existing:        true