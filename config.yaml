# ==================================================================
# Full installation - everything (~10-12 GB)
# ==================================================================

paths:
  project_root: "."
  runtime_dir:    "runtime"
  python_dir:     "runtime/python"
  duckdb_dir:     "runtime/duckdb"
  extensions_dir: "runtime/duckdb/extensions"
  models_dir:     "runtime/models"
  jobs_dir:       "jobs"
  configs_dir:    "configs"
  data_dir:       "data"
  exports_dir:    "exports"
  logs_dir:       "logs"
  mlruns_dir:     "mlruns"
  reports_dir:    "reports"

python:
  version: "3.12.7"

pytorch:
  build: "cpu"
  cuda_version: "cu121"

packages:
  core:            true
  jupyter:         true
  visualization:   true
  streamlit:       true
  eda:             true
  data_quality:    true
  notebook_tools:  true
  scheduling:      true
  ml:              true
  mlops:           true
  cloud:           true
  utilities:       true

extensions:
  core:
    - parquet
    - json
    - icu
    - httpfs
    - fts
    - vss
    - inet
    - iceberg
    - delta
    - ducklake
    - lance
    - ui
    - postgres_scanner
    - mysql_scanner
    - sqlite_scanner
    - odbc_scanner
  community:
    - qvd
    - pbix
    - oracle_scanner
    - mssql
    - mongo
    - ai
    - whisper
    - cassandra

ai:
  enabled: true
  provider: "llama.cpp"
  bin_dir: "runtime/llama.cpp"
  download_urls:
    windows: "https://huggingface.co/datasets/Fedir-Ilina/llama.ccp/resolve/main/llama-b7589-bin-win-cpu-x64.zip"
    linux:   "https://github.com/ggerganov/llama.cpp/releases/download/b7589/llama-b7589-bin-linux-x64.zip"
    macos:   "https://github.com/ggerganov/llama.cpp/releases/download/b7589/llama-b7589-bin-macos-x64.zip"
    macos_arm: "https://github.com/ggerganov/llama.cpp/releases/download/b7589/llama-b7589-bin-macos-arm64.zip"
  host: "http://localhost:8080"
  port: 8080
  model:
    dir: "runtime/models"
    filename: "qwen2.5-1.5b-instruct-q4_k_m.gguf"
    download_url: "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
    size_gb: 1.0
  server:
    threads: 4
    ctx_size: 2048
    batch_size: 512
    n_gpu_layers: 0

duck_ui:
  enabled: true
  port: 5522

mcp:
  enabled: true
  db_path: ":memory:"
  read_only: true
  http_port: 8801

runtime:
  duckdb_memory_limit: "16GB"
  duckdb_threads: 8
  jupyter_port: 8888
  streamlit_port: 8501

scheduler:
  log_dir: "logs"
  timezone: "UTC"

setup:
  download_python:      true
  download_duckdb:      true
  install_packages:     true
  install_extensions:   true
  create_config_files:  true
  skip_existing:        true

# ==================================================================
# ==================================================================
# BI drivers (ODBC + JDBC for Tableau, Power BI, Qlik Sense)
# ==================================================================
bi_drivers:
  enabled: true
  install_odbc: true
  install_jdbc: true

# Whisper (speech-to-text)
# ==================================================================
whisper:
  enabled: true
  model: "small"
